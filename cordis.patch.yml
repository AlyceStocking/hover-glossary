# hover-glossary bundle patch: mount the hover-glossary plugin.
#
# Applied when this bundle appears in a profile's dsh.profile.bundles list.
# The host half (package root) is a no-op; the browser half (dsh.client) is
# discovered automatically through the package's dsh.client declaration +
# exports["./client"].

- insert:
    - id: hover-glossary
      name: 'hover-glossary'
